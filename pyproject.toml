[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "OpenRecall"
version = "0.9.1"
description = "Privacy-first, local-first digital memory assistant"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-only"
authors = [
    {name = "OpenRecall Contributors"}
]
dependencies = [
    "Flask>=3.0.0",
    "numpy>=1.24.0",
    "mss>=9.0.0",
    "Pillow>=10.0.0",
    "rapidfuzz>=3.0.0",
    "pytesseract>=0.3.10",
    "rapidocr>=3.9.0",
    "onnxruntime>=1.14.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["openrecall*"]

[tool.setuptools.package-data]
openrecall = ["static/*", "static/**/*"]


[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "psutil>=5.9.0",
]
windows = [
    "pywin32",
    "psutil",
]
macos = [
    "pyobjc>=9.0",
]

[project.scripts]
openrecall = "openrecall.app:main"

[project.gui-scripts]
openrecall-bg = "openrecall.app:main"
